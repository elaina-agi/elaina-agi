name: Generate profile assets

# Draws the contribution snake and the contribution pulse, then publishes
# both SVGs to the `output` branch, so main stays free of generated commits.
# One job on purpose: the publish step replaces the whole branch, so two
# separate workflows would wipe each other's files.
on:
  schedule:
    - cron: '43 22 * * *'   # 06:43 Beijing time, daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f0b33c&color_dots=#ece9fb,#cfc5ff,#a996ff,#7d68ee,#5a45d6
            dist/snake-dark.svg?color_snake=#ffd76a&color_dots=#221d45,#3a2f78,#6d5ae6,#a996ff,#d6ccff

      - name: Draw pulse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULSE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/pulse.py

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
