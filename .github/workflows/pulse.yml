name: Update contribution pulse

# Regenerates assets/pulse.svg from the last 30 days of contributions.
on:
  schedule:
    - cron: '17 22 * * *'   # 06:17 Beijing time, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draw pulse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULSE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/pulse.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/pulse.svg; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg
          git commit -m "chore: update contribution pulse"
          git push
