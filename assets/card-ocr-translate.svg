<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="OCR Translate — a lightweight Windows screenshot translation tool. Rust, egui, Windows OCR.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17142f"/>
      <stop offset="1" stop-color="#2b2256"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0b33c"/>
    </linearGradient>
    <clipPath id="sel"><rect x="498" y="32" width="56" height="40" rx="3"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes scan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(34px); } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="579" height="249" rx="16" fill="url(#bg)" stroke="#40367a"/>
  <rect x="0.5" y="28" width="5" height="64" rx="2.5" fill="url(#accent)"/>

  <!-- capture-region glyph with scan line -->
  <rect x="498" y="32" width="56" height="40" rx="3" fill="none" stroke="#ffd76a" stroke-width="2" stroke-dasharray="6 4"/>
  <g clip-path="url(#sel)">
    <rect x="506" y="42" width="30" height="3" rx="1.5" fill="#b9a9ff"/>
    <rect x="506" y="51" width="40" height="3" rx="1.5" fill="#b9a9ff"/>
    <rect x="506" y="60" width="22" height="3" rx="1.5" fill="#b9a9ff"/>
    <rect class="scan" x="498" y="34" width="56" height="2" fill="#ffd76a" opacity="0.9"/>
  </g>

  <text x="30" y="58" class="sans" font-size="27" font-weight="700" fill="#f4f1ff">OCR Translate</text>
  <text x="30" y="84" class="sans" font-size="17" fill="#ffd76a">Select a region, read it in your language</text>

  <g class="sans" font-size="16" fill="#d6d0f2">
    <circle cx="35" cy="117" r="2.5" fill="#a996ff"/>
    <text x="48" y="122">Ctrl+Shift+T to capture any part of the screen</text>
    <circle cx="35" cy="143" r="2.5" fill="#a996ff"/>
    <text x="48" y="148">Local Windows OCR — only the text leaves your machine</text>
    <circle cx="35" cy="169" r="2.5" fill="#a996ff"/>
    <text x="48" y="174">Pinned floating results, translation drawn over the image</text>
  </g>

  <g class="mono" font-size="13" fill="#e4dfff">
    <rect x="30" y="200" width="52" height="26" rx="13" fill="#3a2f78"/>
    <text x="56" y="217" text-anchor="middle">Rust</text>
    <rect x="90" y="200" width="52" height="26" rx="13" fill="#3a2f78"/>
    <text x="116" y="217" text-anchor="middle">egui</text>
    <rect x="150" y="200" width="104" height="26" rx="13" fill="#3a2f78"/>
    <text x="202" y="217" text-anchor="middle">Windows OCR</text>
    <rect x="262" y="200" width="90" height="26" rx="13" fill="#3a2f78"/>
    <text x="307" y="217" text-anchor="middle">System tray</text>
  </g>

  <text x="550" y="218" class="sans" font-size="20" fill="#ffd76a" text-anchor="end">→</text>
</svg>
